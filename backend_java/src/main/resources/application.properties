spring.application.name=keurope-api
server.port=${PORT:5000}

# SQLite: WAL mode + 5s busy timeout, same as the Go backend
spring.datasource.url=jdbc:sqlite:${DB_PATH:./keurope.db}?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10

# Go structs use snake_case json tags
spring.jackson.property-naming-strategy=SNAKE_CASE

keurope.jwt-secret=${JWT_SECRET:your-secret-key-change-this}
keurope.admin-password=${ADMIN_PASSWORD:admin123}

# Swagger UI at /docs (Go served it at /docs/)
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/docs/openapi.json
